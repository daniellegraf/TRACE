name: TRACE validation

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Static, Origin Scan, and glyph regressions
        run: |
          npm test
          npm run test:glyph
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Chromium for browser smoke tests
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Chromium glyph motion smoke test
        run: npm run test:browser
