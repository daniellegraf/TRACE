name: TRACE validation

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Pin dependency graph on TRACE audit branch (one-time)
        if: github.event_name == 'push' && github.ref_name == 'fix/trace-audit-hardening-2026-11-14'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: pin TRACE dependency versions"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Save reproducible dependency lock as artifact
        uses: actions/upload-artifact@v4
        with:
          name: trace-package-lock
          path: package-lock.json
      - name: Static, Origin Scan, and glyph regressions
        run: |
          npm test
          npm run test:glyph
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Chromium for browser smoke tests
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Chromium glyph motion smoke test
        run: npm run test:browser
