<!doctype html><html><head><meta charset="utf-8"/><style>
html,body{margin:0;background:#05070e;color:white}
#grid{display:grid;grid-template-columns:repeat(3,300px);gap:12px}
.g{width:300px;height:300px}.g svg{width:100%;height:100%;display:block}
</style></head><body><div id="grid"></div>
<script src="../trace-glyph-v1.js"></script>
<script>
const styles=Object.keys(TraceGlyphV1.STYLES);
const grid=document.getElementById('grid');
window.makeGlyphs=(n=1)=>{
 grid.innerHTML='';
 for(let i=0;i<n;i++){
  const style=styles[i%styles.length];
  const spec=TraceGlyphV1.createGlyphSpecification({creator_id:'creator',image_sha256:'a'.repeat(64),profile_mindprint_hash:'b'.repeat(64),badge_mindprint_hash:'c'.repeat(64),proof_id:'p'+i,glyph_seed:(i.toString(16).padStart(1,'0')+'d'.repeat(64)).slice(0,64),style,ai_probability:.22});
  const d=document.createElement('div');d.className='g';
  d.innerHTML=TraceGlyphV1.renderGlyphFromSpecification(spec,{width:300,height:300,mode:'badge',quality:'medium'});
  grid.appendChild(d);TraceGlyphV1.startGlyphMotion(d.querySelector('svg'));
 }
};
window.measureFrames=(ms=1500)=>new Promise(resolve=>{
 const arr=[];let start=performance.now(),last=start;
 function f(t){
  arr.push(t-last);last=t;
  if(t-start>=ms){
   const s=[...arr].sort((a,b)=>a-b);
   resolve({frames:arr.length,avg:arr.reduce((a,b)=>a+b,0)/arr.length,p50:s[Math.floor(s.length*.5)],p95:s[Math.floor(s.length*.95)],max:Math.max(...arr),over33:arr.filter(x=>x>33.4).length});
   return;
  }
  requestAnimationFrame(f);
 }
 requestAnimationFrame(f);
});
makeGlyphs(1);
</script></body></html>
